# Containment work (kill-list regeneration, holds/releases, cleanup) runs on
# its own dedicated worker: a backlog of slow untrusted-review jobs can never
# delay an admin revocation reaching the signed data plane.
default: &default
  dispatchers:
    - polling_interval: 1
      batch_size: 500
  workers:
    - queues: critical
      threads: 2
      processes: 1
      polling_interval: 0.5
    - queues: review
      threads: 3
      processes: <%= ENV.fetch("JOB_CONCURRENCY", 1) %>
      polling_interval: 1
    # Explicit list — a wildcard would let long AI reviews starve mail delivery
    - queues: [ default, previews, mailers, active_storage_analysis, active_storage_purge ]
      threads: 2
      processes: 1
      polling_interval: 1

development:
  <<: *default

test:
  <<: *default

production:
  <<: *default
