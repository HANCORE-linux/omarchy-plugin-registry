# Kamal deployment — companion to docs/deploy.md, which explains every
# REGISTRY_* variable and the data-plane layout.
#
# Current target: E2E staging on the homelab VM `omarchy-plugins`, reached over
# Tailscale (MagicDNS resolves the bare name; the public cert is minted with
# `tailscale cert` on the VM and lives in .kamal/local/ — see docs/deploy.md).
# Production cutover to plugins.omarchy.org = swap proxy.host, the REGISTRY_*
# env below, SSL back to `ssl: true` (Let's Encrypt needs public 80/443), and
# the image registry.
service: omarchy-plugin-registry

image: registry/omarchy-plugin-registry

servers:
  web:
    - omarchy-plugins
  # Solid Queue — review pipeline, hold-window releases, index regeneration.
  # Required: without it publishes never process and the data plane never
  # regenerates (docs/deploy.md "Pieces" #2).
  job:
    hosts:
      - omarchy-plugins
    cmd: bin/jobs

proxy:
  host: omarchy-plugins.manatee-piranha.ts.net
  # Tailscale-minted Let's Encrypt cert (no public 80/443 on this box).
  # Renew: docs/deploy.md "Kamal" section — certs last ~90 days.
  ssl:
    certificate_pem: SSL_CERT_PEM
    private_key_pem: SSL_KEY_PEM
  # Thruster listens on 80 inside the container.
  app_port: 80
  healthcheck:
    path: /up

# Self-hosted image registry on the VM itself (registry:2 behind the same
# Tailscale cert, htpasswd auth) — no external registry account needed.
registry:
  server: omarchy-plugins.manatee-piranha.ts.net:5443
  username: kamal
  password:
    - KAMAL_REGISTRY_PASSWORD

builder:
  arch: amd64
  # Plain docker driver: pushes run through the host daemon, which resolves
  # Tailscale MagicDNS names (the default containerized buildkit does not).
  driver: docker

env:
  clear:
    REGISTRY_BASE_URL: https://omarchy-plugins.manatee-piranha.ts.net
    REGISTRY_HOST: omarchy-plugins.manatee-piranha.ts.net
    # Witness on its own volume so an app-volume restore can't silently roll
    # back the signed kill list — see docs/deploy.md.
    REGISTRY_WITNESS_PATH: /witness/kill_list_generation
    # Mailpit accessory (STARTTLS via the same cert): login codes land in the
    # web UI at http://omarchy-plugins:8025 instead of a real mailbox.
    SMTP_ADDRESS: omarchy-plugins.manatee-piranha.ts.net
    SMTP_PORT: "1025"
  secret:
    - RAILS_MASTER_KEY
    - REGISTRY_SIGNING_SEED

volumes:
  # SQLite databases, Active Storage blobs, and the data plane all live under
  # /rails/storage — losing this volume loses accounts, audit, and revocations.
  - "omarchy_registry_storage:/rails/storage"
  - "omarchy_registry_witness:/witness"

# E2E mail catcher: SMTP on 1025 (STARTTLS, real cert so the app's mandatory
# TLS verification passes), web UI on 8025 (tailnet/LAN only).
accessories:
  mailpit:
    image: axllent/mailpit:v1.27
    host: omarchy-plugins
    port: "1025:1025"
    env:
      clear:
        MP_SMTP_TLS_CERT: /certs/tls.crt
        MP_SMTP_TLS_KEY: /certs/tls.key
    files:
      - .kamal/local/tls.crt:/certs/tls.crt
      - .kamal/local/tls.key:/certs/tls.key
    options:
      publish:
        - "8025:8025"

# Bridge assets between versions during deploys so old pages keep resolving
# fingerprinted files.
asset_path: /rails/public/assets

aliases:
  console: app exec --interactive --reuse "bin/rails console"
  shell: app exec --interactive --reuse "bash"
  logs: app logs -f
  dbc: app exec --interactive --reuse "bin/rails dbconsole"
